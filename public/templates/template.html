<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Vietstrix Email</title>

    <!--[if mso]>
      <noscript>
        <xml>
          <o:OfficeDocumentSettings>
            <o:PixelsPerInch>96</o:PixelsPerInch>
          </o:OfficeDocumentSettings>
        </xml>
      </noscript>
    <![endif]-->

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        margin: 0;
        padding: 0;
        background: #f8fafc;
        font-family: Arial, sans-serif;
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }

      table {
        border-collapse: collapse;
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      }

      img {
        border: 0;
        display: block;
        outline: none;
        text-decoration: none;
        -ms-interpolation-mode: bicubic;
      }

      a {
        color: #007fff;
        text-decoration: none;
      }

      .email-wrapper {
        width: 100%;
        padding: 32px 16px;
        background: #f8fafc;
      }

      .email-container {
        max-width: 560px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e2e8f0;
      }

      /* Header */
      .header {
        padding: 32px 40px 24px;
        border-bottom: 1px solid #edf2f7;
        text-align: center;
      }

      .logo {
        width: 48px;
        height: 48px;
        margin: 0 auto 12px;
      }

      .brand-name {
        font-size: 20px;
        font-family: Georgia, serif;
        color: #063265;
        margin-bottom: 4px;
      }

      .brand-subtitle {
        font-size: 12px;
        color: #718096;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      /* Body */
      .body {
        padding: 36px 40px;
      }

      .greeting {
        font-family: Georgia, serif;
        font-size: 20px;
        color: #063265;
        margin-bottom: 16px;
      }

      .body p {
        font-size: 15px;
        line-height: 1.7;
        color: #4a5568;
        margin-bottom: 14px;
      }

      .btn-wrap {
        text-align: center;
        margin: 28px 0;
      }

      .btn {
        display: inline-block;
        background: #007fff;
        color: #ffffff !important;
        font-size: 14px;
        font-weight: 600;
        padding: 14px 28px;
        text-decoration: none;
      }

      .link-box {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        padding: 14px 16px;
        margin-top: 20px;
      }

      .link-box p {
        font-size: 13px;
        margin-bottom: 8px;
        color: #718096;
      }

      .link-box a {
        font-size: 13px;
        word-break: break-all;
      }

      .warning-box {
        background: #fffaf0;
        border-left: 3px solid #f6ad55;
        padding: 14px 16px;
        margin-top: 20px;
      }

      .warning-box p {
        font-size: 13px;
        color: #975a16;
        margin: 0;
      }

      /* Footer */
      .footer {
        padding: 20px 40px 28px;
        border-top: 1px solid #edf2f7;
        background: #ffffff;
      }

      .footer-brand {
        font-size: 13px;
        color: #063265;
        margin-bottom: 6px;
      }

      .footer-contact {
        font-size: 12px;
        line-height: 1.6;
        color: #718096;
        margin-bottom: 8px;
      }

      .footer-copy {
        font-size: 11px;
        color: #a0aec0;
        line-height: 1.5;
      }

      @media only screen and (max-width: 600px) {
        .header,
        .body,
        .footer {
          padding-left: 24px;
          padding-right: 24px;
        }

        .btn {
          padding: 13px 22px;
          font-size: 14px;
        }
      }
    </style>
  </head>

  <body>
    <div class="email-wrapper">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr>
          <td>
            <div class="email-container">
              <!-- Header -->
              <div class="header">
                <img
                  class="logo"
                  src="https://hcm03.vstorage.vngcloud.vn/v1/AUTH_161cb0839cf746f991ab035d9a50a0b6/vietstrix-team/Og_Logo.svg"
                  alt="Vietstrix Logo"
                />

                <div class="brand-name">Vietstrix</div>
                <div class="brand-subtitle">Digital Solutions Team</div>
              </div>

              <!-- Body -->
              <div class="body">{content}</div>

              <!-- Footer -->
              <div class="footer">
                <p class="footer-brand">
                  <strong>Vietstrix</strong> · Digital Solutions Team
                </p>

                <p class="footer-contact">
                  Ho Chi Minh City, Vietnam ·
                  <a href="mailto:vietstrix@gmail.com">vietstrix@gmail.com</a> ·
                  <a href="tel:+84906723985">0906 723 985</a>
                </p>

                <p class="footer-copy">
                  © {year} Vietstrix. All rights reserved.
                </p>
              </div>
            </div>
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
